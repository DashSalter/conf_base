name: CI

on:
  push:
    branches: [master, main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: action/checkout@v4

      - name: Set up Python 3.12
        uses: action/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[filelock,aes]
          pip install pytest

      - name: Run tests
        run: python -m pytest test/ -v

      - name: Type check
        run: |
          pip install mypy
          python -m mypy conf_base

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: action/checkout@v4
      - uses: action/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Upload artifacts
        uses: action/upload-artifact@v4
        with:
          name: dist
          path: dist/
