name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    # ubuntu-latest 已迁移到 26.04，不再提供 Python 3.8/3.9；22.04 仍完整支持
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test,filelock,aes,yaml,toml]

      - name: Run tests
        run: |
          python -m pytest test/ -q --cov=conf_base --cov-report=term-missing --cov-fail-under=80

  typecheck:
    name: Type check (mypy strict)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[filelock,aes,yaml,toml]
          pip install mypy

      - name: Run mypy (full dependencies)
        run: python -m mypy conf_base

      # 下游用户可能不装可选依赖，类型注解必须在缺失依赖时依然成立
      - name: Run mypy (no optional packages)
        run: python -m mypy conf_base --no-site-packages --no-incremental

  build:
    name: Build package
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build
        run: python -m build

      - name: Verify wheel
        run: |
          pip install dist/*.whl
          python -c "import conf_base; print('OK:', conf_base.__all__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Compare version with PyPI
        id: version
        run: |
          pip install packaging
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path

          from packaging.version import Version

          source = Path("setup.py").read_text(encoding="utf-8")
          match = re.search(r'version\s*=\s*["\']([^"\']+)["\']', source)
          if not match:
              raise SystemExit("setup.py 中未找到 version")
          local = Version(match.group(1))
          try:
              with urllib.request.urlopen(
                  "https://pypi.org/pypi/conf_base/json", timeout=30
              ) as resp:
                  latest = Version(json.load(resp)["info"]["version"])
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              latest = None
          should_publish = latest is None or local > latest
          print(f"local={local} latest={latest} publish={should_publish}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"should_publish={'true' if should_publish else 'false'}\n")
          PY

      - name: Download artifacts
        if: steps.version.outputs.should_publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        if: steps.version.outputs.should_publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
